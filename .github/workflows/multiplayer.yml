name: Multiplayer browser validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  four-player:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          npm start > /tmp/game.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
      - name: Run four independent browsers
        run: npx playwright test tests/multiplayer.spec.js --reporter=line
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-failure
          path: |
            test-results/
            /tmp/game.log
